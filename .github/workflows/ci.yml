name: GallosOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Daemon Unit Tests
        run: pytest daemon/tests/ -v

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "build/scripts"

      - name: Validate TOML Syntax
        run: |
          python3 -c "
          import glob, tomllib, sys
          failed = False
          for f in glob.glob('**/*.toml', recursive=True):
              try:
                  with open(f, 'rb') as fp:
                      tomllib.load(fp)
              except Exception as e:
                  print(f'Error in {f}: {e}', file=sys.stderr)
                  failed = True
          if failed:
              sys.exit(1)
          print('All TOML files are syntactically valid.')
          "

