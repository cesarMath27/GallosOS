name: GallosOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linting & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

      - name: Run Daemon Unit Tests
        run: pytest daemon/tests/ -v

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "build/scripts"
          ignore_names: "tomlget.py gen-wallpapers.py"
          additional_files: "scripts/check.sh"
          severity: warning
        env:
          SHELLCHECK_OPTS: -e SC1091

      # In-band desktop helpers (build/desktop/usr/bin/gallos-*, the kiosk
      # launcher and labwc's autostart) are Bash/sh by rule (AGENTS.md
      # § In-Band vs Out-of-Band tooling) and must pass ShellCheck too.
      - name: Run ShellCheck (desktop helpers)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x -S warning -e SC1091 \
            build/desktop/usr/bin/gallos-* \
            build/desktop/etc/profile.d/gallos-kiosk.sh \
            build/desktop/etc/xdg/labwc/autostart

      - name: Validate Desktop Overlay (labwc XML, Waybar JSONC, keybind targets)
        run: python3 scripts/validate_desktop.py

      - name: Validate TOML Syntax
        run: |
          python3 -c "
          import glob, tomllib, sys
          failed = False
          for f in glob.glob('**/*.toml', recursive=True):
              try:
                  with open(f, 'rb') as fp:
                      tomllib.load(fp)
              except Exception as e:
                  print(f'Error in {f}: {e}', file=sys.stderr)
                  failed = True
          if failed:
              sys.exit(1)
          print('All TOML files are syntactically valid.')
          "

