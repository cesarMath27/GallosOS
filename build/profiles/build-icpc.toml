#:schema n/a — build.toml has no published JSON Schema yet (see docs/BUILD_SYSTEM.md).
# First minimal build profile for the Phase 1 walking-skeleton pipeline.
# Produces a bare bootable console image: no .gsm software modules and no
# Wayland kiosk shell yet (both deferred to the next increment).

[build]
base_os = "ubuntu-24.04-minimal"
kernel = "linux-generic-hwe-24.04"
target_arch = "amd64"
# How Stage 1 builds the base rootfs — "debootstrap" (default) pulls live
# from apt_mirror; "tarball" imports the pinned, checksum-verified
# ubuntu-base snapshot from .cache/base-images/ instead (offline-friendly,
# maximally reproducible, but single-source — see docs/BUILD_SYSTEM.md §3).
bootstrap_method = "tarball"
# Apt mirror for debootstrap (Stage 1) and package installs (Stage 2).
# "auto" tries an ordered fallback list (build/scripts/lib-mirrors.sh);
# set an explicit URL (e.g. "http://us.archive.ubuntu.com/ubuntu/") to pin
# one instead — an unreachable explicit mirror fails the build rather than
# silently substituting another.
apt_mirror = "auto"

[optimization]
strip_man_pages = true
strip_docs = true
remove_apt_cache = true
locales = ["en_US.UTF-8"]

[packages]
# Base desktop and contest utilities for the Wayland kiosk environment.
preinstall_apt = [
    "curl",
    "openssh-client",
    "labwc",
    "waybar",
    "foot",
    "mako-notifier",
    "swaybg",
    "seatd",
    "wlr-randr",
    "wmenu",
    "xwayland",
    "fonts-dejavu-core",
    "fonts-liberation",
    "adwaita-icon-theme",
    "dbus-x11",
]

[modules]
# No .gsm modules exist in this repo yet — intentionally empty for Phase 1's
# first increment.
bundle = []

[security]
# Static MVP posture baked at build time (docs/ANTI_CHEAT_AND_SECURITY.md §3).
# Real per-event/per-mode rendering from gallos.toml is Phase 3 (gallos-daemon)
# work — these are illustrative build-time-only defaults for this walking
# skeleton, not a live judge whitelist.
disable_ipv6 = true
judge_ips = ["192.168.50.10"]
venue_controller_ip = "192.168.50.1"
local_dns_ip = "192.168.1.1"
telemetry_dns_blacklist = [
    "1.1.1.1", "1.0.0.1", "8.8.8.8", "8.8.4.4",
    "9.9.9.9", "9.9.9.10", "149.112.112.10", "149.112.112.112",
]
blocked_tcp_ports = [22, 853]
allow_usb_storage = false

