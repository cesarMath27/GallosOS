# GallosOS foot terminal (foot.ini(5)). Read via XDG_CONFIG_DIRS=/etc/xdg.
# Palette "Graphite & Steel" — see /etc/xdg/labwc/themerc-override.

[main]
font=JetBrains Mono:size=11,Liberation Mono:size=11,DejaVu Sans Mono:size=11
pad=10x8
initial-window-size-chars=100x30
bold-text-in-bright=no

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes
# foreground (text under cursor)  background (cursor block/beam)
color=111418 5a9bd8

[colors]
alpha=0.97
background=111418
foreground=e4e8ee
selection-foreground=111418
selection-background=5a9bd8

regular0=1f242c
regular1=d1495b
regular2=4caf7d
regular3=e2a336
regular4=5a9bd8
regular5=b07cc6
regular6=3aa39a
regular7=c9d1dc

bright0=4b5563
bright1=e06c7a
bright2=6cc999
bright3=f0b95b
bright4=7fb3e6
bright5=c99ad8
bright6=5fbfb6
bright7=e4e8ee

[csd]
# labwc draws one consistent server-side titlebar for every window.
preferred=server
